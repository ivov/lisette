[package]
name = "tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dev-dependencies]
semantics = { package = "lisette-semantics", path = "../crates/semantics" }
passes = { package = "lisette-passes", path = "../crates/passes" }
syntax = { package = "lisette-syntax", path = "../crates/syntax" }
diagnostics = { package = "lisette-diagnostics", path = "../crates/diagnostics" }
format = { package = "lisette-format", path = "../crates/format" }
emit = { package = "lisette-emit", path = "../crates/emit" }
stdlib = { package = "lisette-stdlib", path = "../crates/stdlib" }
deps = { package = "lisette-deps", path = "../crates/deps" }
lisette_lsp = { package = "lisette-lsp", path = "../crates/lsp" }
rustc-hash.workspace = true
rayon.workspace = true
insta.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
toml_edit = { version = "0.25", features = ["serde"] }

# `fast_*`: the compiler and language server as a library, without `lis` or Go. CI runs these on every PR.

[[test]]
name = "fast_suite"
path = "fast_suite.rs"

[[test]]
name = "fast_release"
path = "fast_release.rs"

[[test]]
name = "fast_lsp"
path = "fast_lsp.rs"

# `cli_*`: `lis` CLI commands on small projects. CI runs these on every PR.

[[test]]
name = "cli_language"
path = "cli_language.rs"

[[test]]
name = "cli_run"
path = "cli_run.rs"

[[test]]
name = "cli_cross"
path = "cli_cross.rs"

[[test]]
name = "cli_library"
path = "cli_library.rs"

[[test]]
name = "cli_go_dependencies"
path = "cli_go_dependencies.rs"

[[test]]
name = "cli_external_tests"
path = "cli_external_tests.rs"

[[test]]
name = "cli_learn"
path = "cli_learn.rs"

[[test]]
name = "cli_lsp"
path = "cli_lsp.rs"

# `go_*`: Lisette against the Go toolchain. CI runs these on every PR.

[[test]]
name = "go_emit"
path = "go_emit.rs"

[[test]]
name = "go_rejections"
path = "go_rejections.rs"

# `fuzz_*`: random changes to test programs. CI runs these nightly.

[[test]]
name = "fuzz_emit"
path = "fuzz_emit.rs"

[lints]
workspace = true
