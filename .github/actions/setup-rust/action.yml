name: Setup Rust
description: Install the pinned Rust toolchain, and optionally set up just, Go, and the Rust cache

inputs:
  just:
    description: Install the just task runner
    required: false
    default: 'false'
  go:
    description: Install Go.
    required: false
    default: 'false'
  go-cache:
    description: Let setup-go cache GOMODCACHE/GOCACHE.
    required: false
    default: 'true'
  cache:
    description: Restore the Swatinem/rust-cache
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      shell: bash
      run: rustup show
    - if: inputs.just == 'true'
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # ratchet:extractions/setup-just@v4
    - if: inputs.go == 'true'
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # ratchet:actions/setup-go@v6
      with:
        go-version-file: go-toolchain
        cache: ${{ inputs.go-cache }}
        cache-dependency-path: '**/go.sum'
    - if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # ratchet:Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
