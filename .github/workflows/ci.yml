name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Changes
    if: ${{ !startsWith(github.head_ref, 'release-plz-') }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      site: ${{ steps.classify.outputs.site }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - name: Classify the changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: scripts/classify-changes.sh >> "$GITHUB_OUTPUT"

  pr-title:
    name: PR title
    if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-plz-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          CONVENTIONAL_COMMIT_REGEX: '^(feat|fix|refactor|test|docs|chore|ci|perf|build)(\(.+\))?!?: [a-z`].*'
        run: |
          if ! echo "$PR_TITLE" | grep -qE "$CONVENTIONAL_COMMIT_REGEX"; then
            echo "PR title: $PR_TITLE"
            echo ""
            echo "PR title must follow Conventional Commits: <type>: <description>"
            echo "Types: feat, fix, refactor, test, docs, chore, ci, perf, build"
            exit 1
          fi
          LEN=$(echo -n "$PR_TITLE" | wc -c | tr -d ' ')
          if [ "$LEN" -gt 72 ]; then
            echo "PR title is $LEN chars (max 72)"
            exit 1
          fi

  format:
    name: Format
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          just: 'true'
          cache: 'false'
      - run: just format-check

  snapshot-style:
    name: Snapshot style
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - run: ./scripts/check-snapshot-block-style.sh

  go-versions-sync:
    name: Go versions sync
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - run: ./scripts/check-go-versions.sh

  clippy:
    name: Clippy
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          just: 'true'
      - run: just lint
      - run: just lint-satellites

  go-checks:
    name: Go checks
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # ratchet:actions/setup-go@v6
        with:
          go-version-file: go-toolchain
          cache: true
          cache-dependency-path: '**/go.sum'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # ratchet:actions/cache@v4
        id: cache-golangci-lint
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-v2.12.1-${{ runner.os }}
      - if: steps.cache-golangci-lint.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.1
      - run: cd bindgen && golangci-lint run
      - run: cd prelude && golangci-lint run
      - run: cd bindgen && go test ./...

  test-suite:
    name: Test suite
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      - run: cargo test -p tests --test suite --locked -- --format terse
      - run: cargo test -p tests --test manifest_pins --locked -- --format terse

  test-unit:
    name: Unit tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          just: 'true'
      - run: just test-unit

  lsp-test:
    name: LSP tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      - run: cargo test -p lisette-lsp --test lsp --locked -- --format terse

  e2e-smoke:
    name: E2E smoke
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          go: 'true'
          go-cache: 'false'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # ratchet:actions/cache@v4
        id: go-build-cache
        with:
          path: ~/.cache/go-build
          key: go-build-e2e-smoke-${{ runner.os }}-${{ hashFiles('go-toolchain', 'go-language', 'Cargo.lock', 'crates/**', 'tests/**', 'prelude/**') }}
          restore-keys: |
            go-build-e2e-smoke-${{ runner.os }}-
      - run: cargo build -p lisette --locked
      - run: cargo test -p tests --test e2e_smoke --locked -- --format terse
      - run: cargo test -p tests --test e2e_learn --locked -- --format terse
      - run: cargo test -p tests --test e2e_run --locked -- --format terse
      - run: cargo test -p tests --test e2e_library --locked -- --format terse
      - if: github.ref == 'refs/heads/main' && steps.go-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # ratchet:actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ steps.go-build-cache.outputs.cache-primary-key }}

  stdlib-check:
    name: Stdlib check
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          just: 'true'
          go: 'true'
      - run: just check-stdlib-drift

  tree-sitter-check:
    name: Tree-sitter check
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/tree-sitter-lisette
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # ratchet:actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/tree-sitter-lisette/package-lock.json
      - run: npm ci
      - name: Check parser-grammar sync
        run: |
          npx tree-sitter generate
          if ! git diff --exit-code src/; then
            echo "::error::tree-sitter generated artifacts are out of sync with grammar.js"
            echo "Run 'npx tree-sitter generate' in editors/tree-sitter-lisette and commit src/."
            exit 1
          fi
      - run: npx tree-sitter test

  ide-extension-version-check:
    name: IDE extension version check
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require IDE extension version bump on grammar change
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE"
          BASE_REF="origin/$BASE"
          fail=0

          if git diff --name-only "$BASE_REF..HEAD" -- editors/vscode/syntaxes/lisette.tmLanguage.json | grep -q .; then
            curr=$(jq -r .version editors/vscode/package.json)
            prev=$(git show "$BASE_REF:editors/vscode/package.json" | jq -r .version)
            if [ "$curr" = "$prev" ]; then
              echo "::error::editors/vscode/syntaxes/lisette.tmLanguage.json changed but editors/vscode/package.json version was not bumped (still $curr)"
              fail=1
            fi
          fi

          exit $fail

  e2e-suite:
    name: E2E suite
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          just: 'true'
          go: 'true'
          go-cache: 'false'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # ratchet:actions/cache@v4
        id: go-build-cache
        with:
          path: ~/.cache/go-build
          key: go-build-e2e-suite-${{ runner.os }}-${{ hashFiles('go-toolchain', 'go-language', 'Cargo.lock', 'crates/**', 'tests/**', 'prelude/**') }}
          restore-keys: |
            go-build-e2e-suite-${{ runner.os }}-
      - run: just test-e2e-suite
      - if: github.ref == 'refs/heads/main' && steps.go-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # ratchet:actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ steps.go-build-cache.outputs.cache-primary-key }}

  embed-diff:
    name: Embed differential
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          just: 'true'
          go: 'true'
      - run: just test-embed-diff

  prelude-go:
    name: Prelude tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # ratchet:actions/setup-go@v6
        with:
          go-version-file: go-toolchain
          cache: true
          cache-dependency-path: '**/go.sum'
      - run: cd prelude && go test ./...

  minimum-go-tests:
    name: Tests on minimum Go
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # ratchet:actions/setup-go@v6
        with:
          go-version-file: go-language
          cache: true
          cache-dependency-path: '**/go.sum'
      - run: cd prelude && go test ./...
      # The name filter can silently match nothing after a rename; the grep
      # fails the job unless at least one test actually passed.
      - run: |
          set -o pipefail
          cargo test -p tests --test e2e_library --locked external_go_program_imports_the_library -- --format terse 2>&1 | tee test-output.log
          grep -qE 'test result: ok\. [1-9]' test-output.log

  shear:
    name: Shear
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          cache: 'false'
      - uses: taiki-e/install-action@1329c298aa20c3257846c9b2e0e55967df3e3c37 # ratchet:taiki-e/install-action@v2
        with:
          tool: cargo-shear@1.6.0
      - run: cargo shear

  deny:
    name: Deny
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          cache: 'false'
      - uses: taiki-e/install-action@1329c298aa20c3257846c9b2e0e55967df3e3c37 # ratchet:taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.0
      - run: cargo deny check

  site:
    name: Site build
    needs: changes
    if: ${{ needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # ratchet:actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build

  required-checks:
    name: Required checks
    needs:
      - changes
      - pr-title
      - format
      - snapshot-style
      - go-versions-sync
      - clippy
      - go-checks
      - test-suite
      - test-unit
      - lsp-test
      - e2e-smoke
      - stdlib-check
      - tree-sitter-check
      - ide-extension-version-check
      - e2e-suite
      - embed-diff
      - prelude-go
      - minimum-go-tests
      - shear
      - deny
      - site
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every job's result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<< "$RESULTS"
          bad=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key' <<< "$RESULTS")
          if [ -n "$bad" ]; then
            echo "::error::Jobs failed or were cancelled: $(tr '\n' ' ' <<< "$bad")"
            exit 1
          fi
