name: Nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  find-open-issue:
    name: Find open issue
    if: github.repository == 'ivov/lisette'
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.find.outputs.number }}
      run: ${{ github.event_name == 'workflow_dispatch' || steps.find.outputs.number == '' }}
    steps:
      - id: find
        run: |
          number=$(gh issue list --repo ivov/lisette --state open --search 'in:title "Nightly findings"' --json number,title --jq '[.[] | select(.title | startswith("Nightly findings"))][0].number // ""')
          echo "number=$number" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  crash-fuzzing:
    name: ${{ matrix.title }} fuzzing
    needs: find-open-issue
    if: needs.find-open-issue.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: parse
            recipe: fuzz-parse
            title: Parser
          - target: infer
            recipe: fuzz-infer
            title: Type checker
          - target: scan_imports
            recipe: fuzz-scan-imports
            title: Import scanner
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # ratchet:dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # ratchet:Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target

      - name: Cache cargo-fuzz binary
        id: cache-cargo-fuzz
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.1

      - name: Install cargo-fuzz
        if: steps.cache-cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --version 0.13.1 --locked

      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache/restore@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # ratchet:extractions/setup-just@v4

      - name: Minimize corpus
        run: cargo +nightly fuzz cmin ${{ matrix.target }} -- -rss_limit_mb=2048

      - name: Fuzz ${{ matrix.target }}
        run: just ${{ matrix.recipe }}

      - name: Save corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache/save@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload crash artifacts
        if: failure() && hashFiles('fuzz/artifacts/**') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # ratchet:actions/upload-artifact@v6
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/

      - name: Write report section
        if: failure()
        run: .github/scripts/nightly-report.sh crash "$TITLE" "$TARGET" fuzz/artifacts "$RUNNER_TEMP/nightly-report/crashes-$INDEX.md"
        env:
          TARGET: ${{ matrix.target }}
          TITLE: ${{ matrix.title }}
          INDEX: ${{ strategy.job-index }}

      - name: Upload report section
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # ratchet:actions/upload-artifact@v6
        with:
          name: nightly-report-crash-fuzzing-${{ matrix.target }}
          path: ${{ runner.temp }}/nightly-report/

  emitter-fuzzing:
    name: Emitter fuzzing
    needs: find-open-issue
    if: needs.find-open-issue.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - uses: ./.github/actions/setup-rust
        with:
          just: 'true'
          go: 'true'
          go-cache: 'false'

      - name: Fuzz emitter
        env:
          FUZZ_SEED: ${{ github.run_id }}
          FUZZ_OUT: ${{ runner.temp }}/fuzz-emit
        run: just test-fuzz 1500

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # ratchet:actions/upload-artifact@v6
        with:
          name: emitter-fuzzing-findings
          path: |
            ${{ runner.temp }}/fuzz-emit/new/
            ${{ runner.temp }}/fuzz-emit/hang/
            ${{ runner.temp }}/fuzz-emit/summary.txt
          if-no-files-found: ignore

      - name: Write report section
        if: failure()
        run: .github/scripts/nightly-report.sh body "$RUNNER_TEMP/fuzz-emit/issue.md" "$RUNNER_TEMP/nightly-report/emitter.md"

      - name: Upload report section
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # ratchet:actions/upload-artifact@v6
        with:
          name: nightly-report-emitter-fuzzing
          path: ${{ runner.temp }}/nightly-report/

  metamorphic-testing:
    name: Metamorphic testing
    needs: find-open-issue
    if: needs.find-open-issue.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - uses: ./.github/actions/setup-rust
        with:
          just: 'true'
          go: 'true'
          go-cache: 'false'

      - name: Run metamorphic tests
        env:
          GO_EQUIVALENTS_REPORT: ${{ runner.temp }}/go-equivalents.md
        run: just test-go go_equivalents

      - name: Write report section
        if: failure()
        run: .github/scripts/nightly-report.sh body "$RUNNER_TEMP/go-equivalents.md" "$RUNNER_TEMP/nightly-report/metamorphic.md"

      - name: Upload report section
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # ratchet:actions/upload-artifact@v6
        with:
          name: nightly-report-metamorphic-testing
          path: ${{ runner.temp }}/nightly-report/

  report:
    name: Report
    needs: [find-open-issue, crash-fuzzing, emitter-fuzzing, metamorphic-testing]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # ratchet:actions/download-artifact@v7
        with:
          pattern: nightly-report-*
          path: ${{ runner.temp }}/nightly-report
          merge-multiple: true

      - name: Write report
        run: .github/scripts/nightly-report.sh join "$RUNNER_TEMP/nightly-report" "$RUNNER_TEMP/report.md" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Open issue or add comment
        run: |
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --repo ivov/lisette --body-file "$RUNNER_TEMP/report.md"
          else
            gh issue create --repo ivov/lisette --title "Nightly findings $(date -u +%F)" --body-file "$RUNNER_TEMP/report.md"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ needs.find-open-issue.outputs.number }}
