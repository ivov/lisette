name: Nightly
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  cargo-fuzz:
    name: cargo fuzz (${{ matrix.target }})
    if: github.repository == 'ivov/lisette'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: parse
            recipe: fuzz-parse
          - target: infer
            recipe: fuzz-infer
          - target: scan_imports
            recipe: fuzz-scan-imports
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # ratchet:dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # ratchet:Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target

      - name: Cache cargo-fuzz binary
        id: cache-cargo-fuzz
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.1

      - name: Install cargo-fuzz
        if: steps.cache-cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --version 0.13.1 --locked

      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache/restore@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # ratchet:extractions/setup-just@v4

      - name: Minimize corpus
        run: cargo +nightly fuzz cmin ${{ matrix.target }} -- -rss_limit_mb=2048

      - name: Fuzz ${{ matrix.target }}
        run: just ${{ matrix.recipe }}

      - name: Save corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache/save@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload crash artifacts
        if: failure() && hashFiles('fuzz/artifacts/**') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # ratchet:actions/upload-artifact@v6
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/

      - name: Create issue on crash
        if: failure() && hashFiles('fuzz/artifacts/**') != ''
        run: |
          gh issue create \
            --repo ivov/lisette \
            --title "fuzz-${{ matrix.target }} crash (run ${{ github.run_id }})" \
            --body "The \`${{ matrix.target }}\` target crashed in a scheduled fuzz run.

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Artifact:** \`fuzz-crash-${{ matrix.target }}\` (attached to the run)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create issue on job failure
        if: failure() && hashFiles('fuzz/artifacts/**') == ''
        run: |
          gh issue create \
            --repo ivov/lisette \
            --title "fuzz-${{ matrix.target }} job failed (run ${{ github.run_id }})" \
            --body "The \`${{ matrix.target }}\` job failed in a scheduled fuzz run. The usual cause is the target no longer building against current \`crates/\`.

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-fuzz-open-issue:
    name: Fuzz tests open issue
    if: github.repository == 'ivov/lisette'
    runs-on: ubuntu-latest
    outputs:
      open: ${{ steps.count.outputs.open }}
    steps:
      - id: count
        run: |
          open=$(gh issue list --repo ivov/lisette --state open --search 'in:title "Fuzz run findings"' --json title --jq '[.[] | select(.title == "Fuzz run findings")] | length')
          echo "open=$open" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-fuzz:
    name: Fuzz tests
    needs: test-fuzz-open-issue
    if: github.event_name == 'workflow_dispatch' || needs.test-fuzz-open-issue.outputs.open == '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - uses: ./.github/actions/setup-rust
        with:
          just: 'true'
          go: 'true'
          go-cache: 'false'

      - name: Fuzz tests
        env:
          FUZZ_SEED: ${{ github.run_id }}
          FUZZ_OUT: ${{ runner.temp }}/fuzz-emit
        run: just test-fuzz 1500

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # ratchet:actions/upload-artifact@v6
        with:
          name: test-fuzz-findings
          path: |
            ${{ runner.temp }}/fuzz-emit/new/
            ${{ runner.temp }}/fuzz-emit/hang/
            ${{ runner.temp }}/fuzz-emit/summary.txt
          if-no-files-found: ignore

      - name: Create issue on failure
        if: failure() && needs.test-fuzz-open-issue.outputs.open == '0'
        run: |
          body="$RUNNER_TEMP/fuzz-emit/issue.md"
          if [ ! -f "$body" ]; then
            body="$RUNNER_TEMP/issue.md"
            echo "\`fuzz_emit\` failed in [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) without a report. The run log has the cause." > "$body"
          fi
          gh issue create \
            --repo ivov/lisette \
            --title "Fuzz run findings" \
            --body-file "$body"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go-equivalents:
    name: Go equivalents
    if: github.repository == 'ivov/lisette'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - uses: ./.github/actions/setup-rust
        with:
          just: 'true'
          go: 'true'
          go-cache: 'false'

      - run: just test-go go_equivalents
