<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lisette lines of code</title>
    <style>
      :root {
        --page: #0d0d0d;
        --surface: #1a1a19;
        --text-primary: #ffffff;
        --text-secondary: #c3c2b7;
        --text-muted: #898781;
        --grid: #2c2c2a;
        --axis: #383835;
        --border: rgba(255, 255, 255, 0.1);
      }
      * {
        box-sizing: border-box;
      }
      html {
        background: var(--page);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        margin: 0 auto;
        padding: 24px 20px 16px;
        max-width: 1280px;
        color: var(--text-secondary);
        font-size: 14px;
      }
      a {
        color: #3987e5;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      header h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--text-primary);
      }
      header .meta {
        font-size: 0.8rem;
        color: var(--text-muted);
      }
      .charts {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      @media (max-width: 980px) {
        .charts {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 620px) {
        .charts {
          grid-template-columns: 1fr;
        }
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px 10px;
      }
      .card-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
      }
      .card-title {
        display: flex;
        align-items: center;
        gap: 7px;
        font-weight: 600;
        color: var(--text-primary);
        font-size: 0.9rem;
      }
      .card-title .key {
        width: 12px;
        height: 3px;
        border-radius: 2px;
        flex: none;
      }
      .card-value {
        color: var(--text-secondary);
        font-size: 0.85rem;
      }
      .card-value span {
        color: var(--text-muted);
        font-size: 0.75rem;
      }
      .plot {
        position: relative;
        height: 180px;
      }
      details {
        margin-top: 20px;
      }
      summary {
        cursor: pointer;
        color: var(--text-muted);
        font-size: 0.85rem;
      }
      .table-wrap {
        overflow-x: auto;
        margin-top: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.78rem;
        background: var(--surface);
      }
      th,
      td {
        padding: 5px 10px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      th {
        color: var(--text-primary);
        font-weight: 600;
        border-bottom: 1px solid var(--axis);
      }
      td {
        color: var(--text-secondary);
        border-bottom: 1px solid var(--grid);
      }
      tr:last-child td {
        border-bottom: none;
      }
      footer {
        display: flex;
        align-items: center;
        margin-top: 20px;
        font-size: 0.75rem;
        color: var(--text-muted);
      }
      footer .spacer {
        flex: auto;
      }
      button {
        background: transparent;
        color: var(--text-secondary);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 0.75rem;
        cursor: pointer;
      }
      button:hover {
        color: var(--text-primary);
        border-color: var(--text-muted);
      }
      .chart-tooltip {
        position: absolute;
        z-index: 10;
        pointer-events: none;
        opacity: 0;
        max-width: 340px;
        padding: 8px 10px;
        background: rgba(36, 36, 35, 0.97);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 12px;
        line-height: 1.45;
      }
      .chart-tooltip .tt-title,
      .chart-tooltip .tt-value {
        color: var(--text-primary);
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <header>
      <h1 id="suite-name"></h1>
      <span class="meta">updated <span id="last-update"></span></span>
      <span class="meta"><a id="repository-link" rel="noopener"></a></span>
    </header>
    <main id="main"></main>
    <details>
      <summary>Data table</summary>
      <div class="table-wrap"><table id="data-table"></table></div>
    </details>
    <footer>
      <button id="dl-button">Download data as JSON</button>
      <div class="spacer"></div>
      <div>Powered by <a rel="noopener" href="https://github.com/marketplace/actions/continuous-benchmark">github-action-benchmark</a></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="data.js"></script>
    <script>
      'use strict';
      (function () {
        const css = getComputedStyle(document.documentElement);
        const token = (name) => css.getPropertyValue(name).trim();
        const SURFACE = token('--surface');

        const SERIES_COLORS = [
          '#3987e5', // blue
          '#199e70', // aqua
          '#c98500', // yellow
          '#008300', // green
          '#9085e9', // violet
          '#e66767', // red
          '#d55181', // magenta
          '#d95926', // orange
        ];

        const pad = (n) => String(n).padStart(2, '0');
        const formatDay = (ms) => {
          const d = new Date(ms);
          return pad(d.getDate()) + '.' + pad(d.getMonth() + 1);
        };
        const formatDate = (ms) => formatDay(ms) + '.' + new Date(ms).getFullYear();
        const formatCount = (v) => v.toLocaleString('en-US');
        const kFormat = (v) => (Math.abs(v) >= 1000 ? +(v / 1000).toFixed(1) + 'k' : String(v));

        const crosshair = {
          id: 'crosshair',
          afterDraw(chart) {
            const active = chart.tooltip && chart.tooltip.getActiveElements();
            if (!active || !active.length) return;
            const { ctx, chartArea } = chart;
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(active[0].element.x, chartArea.top);
            ctx.lineTo(active[0].element.x, chartArea.bottom);
            ctx.stroke();
            ctx.restore();
          },
        };

        const EXCLUDED = new Set(['total', 'benchmark', 'deps', 'prelude', 'stdlib']);

        // anchor the tooltip model at the cursor itself, placement happens in the external handler
        Chart.Tooltip.positioners.cursor = (_elements, eventPosition) => eventPosition;

        // one shared HTML tooltip, rendered outside the canvas so it can sit
        // at the top right of the cursor without being clipped by the card
        const tooltipEl = () => {
          let el = document.getElementById('chart-tooltip');
          if (!el) {
            el = document.createElement('div');
            el.id = 'chart-tooltip';
            el.className = 'chart-tooltip';
            document.body.appendChild(el);
          }
          return el;
        };

        function externalTooltip(context) {
          const { chart, tooltip } = context;
          const el = tooltipEl();
          if (tooltip.opacity === 0) {
            el.style.opacity = '0';
            return;
          }
          while (el.firstChild) el.removeChild(el.firstChild);
          const addLine = (text, cls) => {
            const div = document.createElement('div');
            div.className = cls;
            div.textContent = text;
            el.appendChild(div);
          };
          for (const line of tooltip.title || []) addLine(line, 'tt-title');
          for (const item of tooltip.body || []) for (const line of item.lines) addLine(line, 'tt-value');

          const rect = chart.canvas.getBoundingClientRect();
          const pad = 12;
          let left = rect.left + window.scrollX + tooltip.caretX + pad;
          let top = rect.top + window.scrollY + tooltip.caretY - pad - el.offsetHeight;
          const maxLeft = window.scrollX + document.documentElement.clientWidth - el.offsetWidth - 8;
          if (left > maxLeft) left = maxLeft;
          const minTop = window.scrollY + 8;
          if (top < minTop) top = minTop;
          el.style.left = left + 'px';
          el.style.top = top + 'px';
          el.style.opacity = '1';
        }

        const data = window.BENCHMARK_DATA;
        document.getElementById('last-update').textContent = formatDate(data.lastUpdate);
        const repoLink = document.getElementById('repository-link');
        repoLink.href = data.repoUrl;
        repoLink.textContent = data.repoUrl.replace('https://github.com/', '');
        document.getElementById('dl-button').onclick = () => {
          const a = document.createElement('a');
          a.href = 'data:,' + encodeURIComponent(JSON.stringify(data, null, 2));
          a.download = 'benchmark_data.json';
          a.click();
        };

        const main = document.getElementById('main');
        for (const [suiteName, entries] of Object.entries(data.entries)) {
          document.getElementById('suite-name').textContent = suiteName;
          renderSuite(entries, main);
        }

        function renderSuite(entries, parent) {
          const labels = entries.map((e) => formatDay(e.date));

          // color by first appearance so a series keeps its hue as data grows
          const series = new Map();
          for (const entry of entries) {
            for (const bench of entry.benches) {
              if (EXCLUDED.has(bench.name)) continue;
              if (!series.has(bench.name)) {
                series.set(bench.name, {
                  name: bench.name,
                  unit: bench.unit,
                  color: SERIES_COLORS[series.size % SERIES_COLORS.length],
                  values: new Array(entries.length).fill(null),
                });
              }
            }
          }
          entries.forEach((entry, i) => {
            for (const bench of entry.benches) {
              const s = series.get(bench.name);
              if (s) s.values[i] = bench.value;
            }
          });

          const latest = (s) => {
            for (let i = s.values.length - 1; i >= 0; i--) {
              if (s.values[i] != null) return s.values[i];
            }
            return 0;
          };
          const panels = [...series.values()].sort((a, b) => latest(b) - latest(a));

          // shared y max so panel heights are proportional across crates
          const yMax = 30000;

          const grid = document.createElement('div');
          grid.className = 'charts';
          parent.appendChild(grid);
          for (const s of panels) renderPanel(grid, s, entries, labels, yMax);
          renderTable(panels, entries);
        }

        function renderPanel(parent, s, entries, labels, yMax) {
          const card = document.createElement('div');
          card.className = 'card';

          const head = document.createElement('div');
          head.className = 'card-head';
          const title = document.createElement('div');
          title.className = 'card-title';
          const key = document.createElement('span');
          key.className = 'key';
          key.style.background = s.color;
          title.appendChild(key);
          title.appendChild(document.createTextNode(s.name));
          const value = document.createElement('div');
          value.className = 'card-value';
          value.textContent = formatCount(latestValue(s)) + ' ';
          const unit = document.createElement('span');
          unit.textContent = s.unit;
          value.appendChild(unit);
          head.appendChild(title);
          head.appendChild(value);
          card.appendChild(head);

          const plot = document.createElement('div');
          plot.className = 'plot';
          const canvas = document.createElement('canvas');
          plot.appendChild(canvas);
          card.appendChild(plot);
          parent.appendChild(card);

          const lastIdx = s.values.reduce((acc, v, i) => (v != null ? i : acc), -1);

          new Chart(canvas, {
            type: 'line',
            data: {
              labels,
              datasets: [
                {
                  label: s.name,
                  data: s.values,
                  borderColor: s.color,
                  backgroundColor: s.color + '1a',
                  fill: true,
                  borderWidth: 2,
                  borderJoinStyle: 'round',
                  borderCapStyle: 'round',
                  spanGaps: false,
                  pointRadius: (ctx) => (ctx.dataIndex === lastIdx ? 4 : 0),
                  pointBackgroundColor: s.color,
                  pointBorderColor: SURFACE,
                  pointBorderWidth: 2,
                  pointHoverRadius: 5,
                  pointHoverBackgroundColor: s.color,
                  pointHoverBorderColor: SURFACE,
                  pointHoverBorderWidth: 2,
                },
              ],
            },
            plugins: [crosshair],
            options: {
              maintainAspectRatio: false,
              interaction: { mode: 'index', intersect: false },
              plugins: {
                legend: { display: false },
                tooltip: {
                  enabled: false,
                  external: externalTooltip,
                  position: 'cursor',
                  animation: false,
                  callbacks: {
                    title: (items) => formatDate(entries[items[0].dataIndex].date),
                    label: (item) => formatCount(item.parsed.y) + ' ' + s.unit,
                  },
                },
              },
              onClick: (_evt, elems) => {
                if (elems.length) window.open(entries[elems[0].index].commit.url, '_blank');
              },
              scales: {
                x: {
                  grid: { display: false },
                  border: { color: token('--axis') },
                  ticks: {
                    color: token('--text-muted'),
                    maxRotation: 0,
                    autoSkip: true,
                    maxTicksLimit: 4,
                    font: { size: 10 },
                  },
                },
                y: {
                  beginAtZero: true,
                  max: yMax,
                  grid: { color: token('--grid'), drawTicks: false },
                  border: { display: false },
                  ticks: {
                    color: token('--text-muted'),
                    maxTicksLimit: 5,
                    padding: 6,
                    font: { size: 10 },
                    callback: (v) => kFormat(v),
                  },
                },
              },
            },
          });
        }

        function latestValue(s) {
          for (let i = s.values.length - 1; i >= 0; i--) {
            if (s.values[i] != null) return s.values[i];
          }
          return 0;
        }

        function renderTable(panels, entries) {
          const table = document.getElementById('data-table');
          const thead = document.createElement('thead');
          const headRow = document.createElement('tr');
          for (const text of ['commit', ...panels.map((p) => p.name)]) {
            const th = document.createElement('th');
            th.textContent = text;
            headRow.appendChild(th);
          }
          thead.appendChild(headRow);
          table.appendChild(thead);

          const tbody = document.createElement('tbody');
          for (let i = entries.length - 1; i >= 0; i--) {
            const tr = document.createElement('tr');
            const label = document.createElement('td');
            const link = document.createElement('a');
            link.href = entries[i].commit.url;
            link.rel = 'noopener';
            link.textContent = formatDate(entries[i].date) + ' ' + entries[i].commit.id.slice(0, 7);
            label.appendChild(link);
            tr.appendChild(label);
            for (const p of panels) {
              const td = document.createElement('td');
              td.textContent = p.values[i] == null ? '' : formatCount(p.values[i]);
              tr.appendChild(td);
            }
            tbody.appendChild(tr);
          }
          table.appendChild(tbody);
        }
      })();
    </script>
  </body>
</html>
