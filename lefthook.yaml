commit-msg:
  commands:
    conventional-commit:
      run: |
        MSG=$(head -1 {1})
        echo "$MSG" | grep -qE '^(feat|fix|refactor|test|docs|chore|ci|perf)(\(.+\))?!?: [a-z`].*' || { echo "Commit message must follow Conventional Commits: <type>: <description> (lowercase after colon)"; exit 1; }
        LEN=$(echo -n "$MSG" | wc -c | tr -d ' ')
        [ "$LEN" -le 72 ] || { echo "Commit subject is $LEN chars (max 72)"; exit 1; }

pre-commit:
  parallel: true
  commands:
    check:
      glob: "**/*.{rs,lis,toml}"
      run: just check && cargo run -p lisette -- check crates/stdlib/typedefs/
    bindgen:
      glob: "bindgen/**/*.go"
      root: "bindgen"
      run: just check
    check-stdlib-drift:
      glob: "bindgen/**/*.go"
      run: just check-stdlib-drift
    go-versions-sync:
      glob: "{go-toolchain,prelude/go.mod,bindgen/go.mod,bindgen/internal/cli/metadata/go-toolchain,crates/cli/go-toolchain}"
      run: ./scripts/check-go-versions.sh
    tree-sitter-sync:
      glob: "editors/tree-sitter-lisette/{grammar.js,queries/**/*,src/**/*}"
      root: "editors/tree-sitter-lisette"
      run: |
        npm ci
        npx tree-sitter generate
        git diff --exit-code src || { echo "tree-sitter src/ is out of sync with the pinned CLI; run 'just grammar' and stage src/"; exit 1; }
